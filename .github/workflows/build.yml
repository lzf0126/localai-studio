name: build

# 推一个 v* 标签就自动打包并发 Release；也可以手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --version

      - name: 打包单文件 exe
        run: |
          # ⚠️ 这里的 --add-data 必须用绝对路径。
          #    PyInstaller 解析相对路径时是相对于 --specpath 的，用相对路径会报：
          #      ERROR: Unable to find '...\_build\web' when adding binary and data files
          #    本地构建脚本 (build_exe.ps1) 用的就是绝对路径，所以没踩到这个坑。
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name LocalAIWeb `
            --add-data "$env:GITHUB_WORKSPACE\web;web" `
            --add-data "$env:GITHUB_WORKSPACE\ca-bundle.pem;." `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\_build" `
            --specpath "$env:GITHUB_WORKSPACE\_build" `
            "$env:GITHUB_WORKSPACE\localai_web.py"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 失败" }

      - name: 准备安装包素材
        run: |
          # installer.nsi 里除了 exe 还要打包「使用说明.txt」，
          # 而 PyInstaller 只会把 exe 放进 dist\，所以这里必须补上。
          Copy-Item dist\LocalAIWeb.exe "dist\本地AI助手.exe" -Force
          Copy-Item 使用说明.txt dist\使用说明.txt -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: 安装 NSIS
        run: |
          # ⚠️ GitHub Actions 的每个 run: 步骤都是独立的 shell 进程，
          #    在一步里改 $env:Path 不会传给下一步。
          #    必须写进 $GITHUB_PATH，否则下一步找不到 makensis。
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if ($mk) {
            Write-Host "NSIS 已预装: $mk"
            & $mk /VERSION
          } else {
            Write-Host "未预装，用 choco 安装…"
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            "C:\Program Files\NSIS"       | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "已写入 GITHUB_PATH，后续步骤可用"
          }

      - name: 制作安装包
        run: |
          # 双保险：PATH 里找不到就直接用绝对路径
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) {
            foreach ($p in @('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')) {
              if (Test-Path $p) { $mk = $p; break }
            }
          }
          if (-not $mk) { throw "找不到 makensis，无法制作安装包" }
          Write-Host "使用: $mk"
          & $mk /VERSION

          # NSIS 靠 UTF-8 BOM 才能识别中文脚本，没有 BOM 会按系统 ANSI 代码页
          # 解析并报 Bad text encoding。这里兜一道，避免被编辑器吃掉。
          foreach ($f in @('installer.nsi','使用说明.txt')) {
            if (-not (Test-Path $f)) { continue }
            $b = [System.IO.File]::ReadAllBytes($f)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) {
              Write-Host "$f 已有 UTF-8 BOM ✔"
            } else {
              $text = [System.Text.Encoding]::UTF8.GetString($b)
              [System.IO.File]::WriteAllText($f, $text, (New-Object System.Text.UTF8Encoding($true)))
              Write-Host "$f 缺少 BOM，已补上 ✔"
            }
          }

          # 捕获输出：失败时把它转成 GitHub 注解，
          # 这样可以直接通过 check-runs API 读到错误，不用翻日志页面。
          $out = & $mk /DSRC_DIR=dist /DDEPLOY_ROOT=. installer.nsi 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            $out -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 12 | ForEach-Object {
              Write-Host "::error::NSIS: $($_.Trim())"
            }
            throw "NSIS 编译失败（退出码 $rc）"
          }
          if (-not (Test-Path "dist\本地AI助手_安装程序.exe")) { throw "没有生成安装包" }
          Write-Host "安装包制作成功"

      - name: 计算校验和
        run: |
          Remove-Item dist\SHA256SUMS.txt -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding utf8 dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-Studio-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/本地AI助手_安装程序.exe
            dist/本地AI助手.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 说明 |
            |---|---|
            | **本地AI助手_安装程序.exe** | 安装包，双击安装，带卸载程序 |
            | 本地AI助手.exe | 免安装单文件版，双击即用 |
            | SHA256SUMS.txt | 校验和，可自行验证文件完整性 |

            ## 使用前须装后端

            本程序是客户端，模型计算依赖 [Ollama](https://ollama.com/download)，
            需要单独安装一次（约 1.8 GB）。装完后打开本程序即可。

            ## 关于安全警告

            安装包**未做代码签名**，Windows 可能提示「已保护你的电脑」，
            点「更多信息 → 仍要运行」即可。

            验证文件完整性：

            ```powershell
            Get-FileHash .\本地AI助手_安装程序.exe -Algorithm SHA256
            # 与 SHA256SUMS.txt 里的值比对
            ```

            ## 国内下载慢或断连

            GitHub 直连在国内时断时续。如果卡住，在下载链接前加上
            `https://gh-proxy.com/` 即可：

            ```
            https://gh-proxy.com/https://github.com/lzf0126/localai-studio/releases/download/v3.0.0/本地AI助手_安装程序.exe
            ```

            ## 首次使用

            1. 装好 Ollama
            2. 打开「本地 AI 助手」
            3. 左侧「模型市场」→ 选一个模型 →「下载并部署」
            4. 回「对话」页开始用

            16 GB 内存 / 纯 CPU 的机器推荐 `deepseek-r1:7b`（4.4 GB）。
