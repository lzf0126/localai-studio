name: build

# 推一个 v* 标签就自动打包并发 Release；也可以手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: pip install --upgrade pyinstaller

      - name: 打包单文件 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LocalAIWeb `
            --add-data "web;web" `
            --add-data "ca-bundle.pem;." `
            --distpath dist --workpath _build --specpath _build `
            localai_web.py

      - name: 生成中文名副本
        run: Copy-Item dist\LocalAIWeb.exe "dist\本地AI助手.exe" -Force

      - name: 检查 NSIS
        run: |
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { choco install nsis -y --no-progress }
          makensis /VERSION

      - name: 制作安装包
        run: |
          makensis /DSRC_DIR=dist /DDEPLOY_ROOT=. installer.nsi

      - name: 计算校验和
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-Studio-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/本地AI助手_安装程序.exe
            dist/本地AI助手.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            下载 `本地AI助手_安装程序.exe` 安装即可。

            **注意**：安装包未做代码签名，Windows 可能提示「已保护你的电脑」，
            点「更多信息 → 仍要运行」。

            可用 `SHA256SUMS.txt` 自行校验：
            ```powershell
            Get-FileHash .\本地AI助手_安装程序.exe -Algorithm SHA256
            ```
